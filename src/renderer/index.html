<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      connect-src needs blob: for GLTFLoader (ScenePreview.tsx): three.js's
      FileLoader reads a .glb's embedded textures via fetch() against an
      in-memory blob: URL it creates from the binary buffer, not by
      assigning an <img>.src -- so this is a fetch (connect-src), not an
      image load (img-src), even though nothing ever leaves the page.
      Without it every embedded texture silently fails and the model
      renders untextured.

      fountain-model: (both img-src and connect-src, since which internal
      path three.js's image loader takes isn't guaranteed) is how an
      operator-imported model (see main/index.ts's custom 3D model import)
      is served back to this page -- it's a custom protocol, not a real
      network origin, but CSP still gates it like any other fetch/img source.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: fountain-model:; connect-src 'self' blob: fountain-model: ws://127.0.0.1:8765 http://127.0.0.1:8765;" />
    <title>Fountain Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
